name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag and package
        id: package
        shell: powershell
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $expected = (Get-Content -LiteralPath .\VERSION -Raw).Trim()

          if ($version -ne $expected) {
            throw "Tag version $version does not match VERSION $expected."
          }

          .\package.ps1 -Version $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.package.outputs.version }}"
          $tag = $env:GITHUB_REF_NAME
          $asset = ".\release\A4ImageCutter-v$version-win.zip"

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag `
              $asset `
              --title "A4 Image Cutter v$version" `
              --notes-file ".\docs\RELEASE_NOTES_1.0.0.md"
          }
