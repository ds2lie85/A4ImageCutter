name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package
        shell: powershell
        run: .\package.ps1 -Version (Get-Content -LiteralPath .\VERSION -Raw).Trim()

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: A4ImageCutter-windows
          path: release/*.zip
          if-no-files-found: error
